name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
      - '!CHANGELOG.md'
      - '!LICENSE'
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
      - '!CHANGELOG.md'
      - '!LICENSE'

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: true
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/Achitekfile
